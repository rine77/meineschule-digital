[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meineschule-digital"
version = "0.1.0"
description = "Unofficial Python client for MeineSchule.digital"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Rene Lange" }
]
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
